<!doctype html>

<!-- Ultimate Game Stash file -->
<!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->

<html lang="en-us">
<head>
  <base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/get%20yoked/">
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>game :D</title>
  <style>
    html, body {
      background: #000;
      width: 100%;
      height: 100%;
      overflow: visible;
      padding: 0;
      margin: 0;
    }

    #gameContainer {
      background: transparent !important;
      position: absolute;
    }

    #gameContainer canvas {
      position: absolute;
    }

    #gameContainer canvas[data-pixel-art="true"] {
      image-rendering: optimizeSpeed;
      image-rendering: -webkit-crisp-edges;
      image-rendering: -moz-crisp-edges;
      image-rendering: -o-crisp-edges;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      -ms-interpolation-mode: nearest-neighbor;
    }

    #loading-text {
      color: white;
      font-family: sans-serif;
      text-align: center;
      margin-top: 1em;
    }
  </style>
</head>

<body>
  <div id="gameContainer">
    <canvas id="unity-canvas" data-pixel-art></canvas>
    <div id="loading-text">LOADING...</div>
  </div>

  <script src="Build/Web.loader.js"></script>
  <script>
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      const meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.head.appendChild(meta);
    }

    const loadingText = document.querySelector('#loading-text');
    let totalBytes = 0;
    let loadedBytes = 0;

    function formatSize(bytes) {
      if (bytes > 1024 * 1024 * 1024) return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
      if (bytes > 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
      if (bytes > 1024) return (bytes / 1024).toFixed(2) + ' KB';
      return bytes + ' B';
    }

    async function getSize(url) {
      try {
        const response = await fetch(url, { method: 'HEAD' });
        return parseInt(response.headers.get('Content-Length') || '0', 10);
      } catch {
        return 0;
      }
    }

    async function fetchPart(url) {
      const response = await fetch(url);
      if (!response.body) {
        const arrayBuffer = await response.arrayBuffer();
        loadedBytes += arrayBuffer.byteLength;
        loadingText.textContent = `LOADING... ${formatSize(loadedBytes)} / ${formatSize(totalBytes)}`;
        return new Uint8Array(arrayBuffer);
      }

      const reader = response.body.getReader();
      const chunks = [];
      let received = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);
        const percent = totalBytes > 0 ? ((loadedBytes / totalBytes) * 100).toFixed(1) : '?';
        loadingText.textContent = `LOADING... ${formatSize(loadedBytes)} / ${formatSize(totalBytes)} (${percent}%)`;
      }

      const full = new Uint8Array(received);
      let offset = 0;
      for (const chunk of chunks) {
        full.set(chunk, offset);
        offset += chunk.length;
      }
      return full;
    }

    async function mergeParts(parts, mimeType) {
      const buffers = await Promise.all(parts.map(fetchPart));
      const totalLength = buffers.reduce((sum, buffer) => sum + buffer.length, 0);
      const concatenated = new Uint8Array(totalLength);
      let offset = 0;
      for (const buffer of buffers) {
        concatenated.set(buffer, offset);
        offset += buffer.length;
      }
      return URL.createObjectURL(new Blob([concatenated], { type: mimeType || undefined }));
    }

    function getParts(file, count) {
      const parts = [];
      for (let i = 1; i <= count; i++) parts.push(file + '.part' + i);
      return parts;
    }

    (async () => {
      try {
        const dataParts = getParts('Build/Web.data', 2);
        const wasmParts = getParts('Build/Web.wasm', 3);
        const allParts = [...dataParts, ...wasmParts, 'Build/Web.framework.js'];
        const sizes = await Promise.all(allParts.map(getSize));
        totalBytes = sizes.reduce((sum, size) => sum + size, 0);

        const [dataUrl, wasmUrl, frameworkUrl] = await Promise.all([
          mergeParts(dataParts),
          mergeParts(wasmParts),
          mergeParts(['Build/Web.framework.js'], 'application/javascript')
        ]);

        const canvas = document.querySelector('#unity-canvas');
        const scaleToFit = true;

        function onResize() {
          const container = canvas.parentElement;
          let width;
          let height;
          if (scaleToFit) {
            width = window.innerWidth;
            height = window.innerHeight;
            const ratio = 540 / 960;
            if (width * ratio > window.innerHeight) width = Math.min(width, Math.ceil(height / ratio));
            height = Math.floor(width * ratio);
          } else {
            width = 960;
            height = 540;
          }
          container.style.width = canvas.style.width = width + 'px';
          container.style.height = canvas.style.height = height + 'px';
          container.style.top = Math.floor((window.innerHeight - height) / 2) + 'px';
          container.style.left = Math.floor((window.innerWidth - width) / 2) + 'px';
        }
        window.addEventListener('resize', onResize);
        onResize();

        await (async function waitForLoader() {
          if (typeof createUnityInstance === 'function') return;
          await new Promise(resolve => {
            const check = setInterval(() => {
              if (typeof createUnityInstance === 'function') {
                clearInterval(check);
                resolve();
              }
            }, 50);
          });
        })();

        const config = {
          dataUrl,
          frameworkUrl,
          codeUrl: wasmUrl,
          streamingAssetsUrl: 'https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/get%20yoked/StreamingAssets',
          companyName: '',
          productName: '',
          productVersion: ''
        };

        createUnityInstance(canvas, config, progress => {
          const percent = Math.round(progress * 100);
          loadingText.textContent = `LOADING... ${percent}%`;
        }).then(() => {
          loadingText.remove();
        }).catch(message => {
          loadingText.textContent = 'Failed to start Unity: ' + message;
          console.error(message);
        });
      } catch (error) {
        loadingText.textContent = 'ERROR: ' + (error.message || error);
        console.error(error);
      }
    })();
  </script>
</body>
</html>
